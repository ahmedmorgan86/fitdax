plugins { id 'com.android.application' }
def signingFile = rootProject.file('.signing/credentials.json')
def signing = signingFile.exists() ? new groovy.json.JsonSlurper().parse(signingFile) : null
android {
 namespace 'com.ahmedmorgan.fitdax'
 compileSdk 36
 defaultConfig { applicationId 'com.ahmedmorgan.fitdax'; minSdk 24; targetSdk 36; versionCode 1; versionName '1.0.0' }
 signingConfigs { release { if(signing) { storeFile rootProject.file('.signing/fitdax-release.jks'); storePassword signing.password; keyAlias 'fitdax'; keyPassword signing.password } } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4' }
